name: CI

on:
    # pull requests are tested via pull_request; pushes only for main, so a PR push doesn't start two runs
    # (release tags are tested by the release workflow)
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
    workflow_call:

# a newer push to the same pull request supersedes the running checks
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    check:
        name: Lint, unit & webview tests, package
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check
            - name: Fetch W3C Turtle 1.1/1.2 test suites
              run: node scripts/fetch-w3c-tests.mjs
            - name: Unit tests (incl. W3C Turtle conformance)
              run: npm run test:unit
              env:
                  W3C_RDF_TESTS: .w3c-rdf-tests
            - run: npx playwright install --with-deps chromium
            - run: npm run test:webview
            - name: Upload Playwright report
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: |
                      playwright-report/
                      test-results/
            - run: npm run package
            - uses: actions/upload-artifact@v7
              with:
                  name: carapace-turtle-vscode-vsix
                  path: "*.vsix"

    integration:
        name: VS Code integration tests (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        # a hung VS Code must not hold a (scarce) macOS runner for hours; queue time does not count
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: Run integration tests
              if: runner.os == 'Linux'
              run: xvfb-run -a npm run test:integration
            - name: Run integration tests
              if: runner.os != 'Linux'
              run: npm run test:integration
